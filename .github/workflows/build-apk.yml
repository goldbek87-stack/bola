name: Build Android (APK va AAB)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: Node.js o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java (JDK 17) o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle o'rnatish
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Android SDK sozlash
        uses: android-actions/setup-android@v3
         with:
    packages: ''

      - name: Android SDK 36 va build-tools 36 o'rnatish
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Cordova o'rnatish
        run: npm install -g cordova

      - name: Android platformasini qo'shish (cordova-android 15, API 36)
        run: cordova platform add android@15.0.0

      - name: Sinov uchun APK (debug)
        run: cordova build android --debug --no-telemetry

      - name: Sinov APK ni saqlash
        uses: actions/upload-artifact@v4
        with:
          name: bilim-va-mukofot-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Imzolangan AAB yasash (Play Market uchun)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          cordova build android --release --no-telemetry -- \
            --packageType=bundle \
            --keystore="$RUNNER_TEMP/upload-keystore.jks" \
            --storePassword="$KEYSTORE_PASSWORD" \
            --alias="$KEY_ALIAS" \
            --password="$KEY_PASSWORD"

      - name: AAB ni saqlash
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: bilim-va-mukofot-release-aab
          path: platforms/android/app/build/outputs/bundle/release/*.aab
